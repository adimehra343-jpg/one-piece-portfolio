    class SoundController {
      constructor() {
        this.ctx = null;
        this.enabled = false;
        this.ambientGain = null;
        this.ambientRunning = false;
      }

      init() {
        if (!this.ctx && typeof window !== 'undefined') {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      toggle() {
        this.init();
        this.enabled = !this.enabled;
        if (this.enabled) {
          this.startAmbientSea();
          this.playChime();
        } else {
          this.stopAmbientSea();
        }
        return this.enabled;
      }

      playSwordSlash() {
        if (!this.enabled || !this.ctx) return;
        try {
          const t = this.ctx.currentTime;
          const bufferSize = this.ctx.sampleRate * 0.18;
          const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

          const noise = this.ctx.createBufferSource();
          noise.buffer = buffer;
          const filter = this.ctx.createBiquadFilter();
          filter.type = 'bandpass';
          filter.frequency.setValueAtTime(3200, t);
          filter.frequency.exponentialRampToValueAtTime(700, t + 0.16);
          filter.Q.setValueAtTime(4.0, t);

          const gain = this.ctx.createGain();
          gain.gain.setValueAtTime(0.01, t);
          gain.gain.linearRampToValueAtTime(0.35, t + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.16);

          noise.connect(filter);
          filter.connect(gain);
          gain.connect(this.ctx.destination);
          noise.start(t);

          const osc = this.ctx.createOscillator();
          const oscGain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(1480, t);
          osc.frequency.exponentialRampToValueAtTime(420, t + 0.14);
          oscGain.gain.setValueAtTime(0.12, t);
          oscGain.gain.exponentialRampToValueAtTime(0.001, t + 0.2);

          osc.connect(oscGain);
          oscGain.connect(this.ctx.destination);
          osc.start(t);
          osc.stop(t + 0.22);
        } catch (e) {}
      }

      playRubberStretch() {
        if (!this.enabled || !this.ctx) return;
        try {
          const t = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(180, t);
          osc.frequency.linearRampToValueAtTime(340, t + 0.08);
          osc.frequency.linearRampToValueAtTime(220, t + 0.16);

          gain.gain.setValueAtTime(0.12, t);
          gain.gain.linearRampToValueAtTime(0.18, t + 0.08);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.2);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(t);
          osc.stop(t + 0.22);
        } catch (e) {}
      }

      playMeatGrabCelebration() {
        this.init();
        if (!this.ctx) return;
        try {
          const t = this.ctx.currentTime;
          const notes = [261.63, 329.63, 392.00, 523.25, 659.25, 783.99, 1046.50];
          notes.forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = idx % 2 === 0 ? 'triangle' : 'sine';
            osc.frequency.setValueAtTime(freq, t + idx * 0.07);

            const startTime = t + idx * 0.07;
            const dur = 0.35 + idx * 0.05;

            gain.gain.setValueAtTime(0.01, startTime);
            gain.gain.linearRampToValueAtTime(0.22, startTime + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, startTime + dur);

            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(startTime);
            osc.stop(startTime + dur + 0.05);
          });
        } catch (e) {}
      }

      playClick() {
        if (!this.enabled || !this.ctx) return;
        try {
          const t = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(800, t);
          osc.frequency.exponentialRampToValueAtTime(300, t + 0.04);
          gain.gain.setValueAtTime(0.1, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(t);
          osc.stop(t + 0.06);
        } catch (e) {}
      }

      playChime() {
        if (!this.ctx) return;
        try {
          const t = this.ctx.currentTime;
          [523.25, 659.25, 783.99].forEach((freq, i) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, t + i * 0.05);
            gain.gain.setValueAtTime(0.12, t + i * 0.05);
            gain.gain.exponentialRampToValueAtTime(0.001, t + i * 0.05 + 0.5);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(t + i * 0.05);
            osc.stop(t + i * 0.05 + 0.6);
          });
        } catch (e) {}
      }

      startAmbientSea() {
        if (this.ambientRunning || !this.ctx) return;
        try {
          const bufferSize = this.ctx.sampleRate * 2;
          const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
          const data = buffer.getChannelData(0);
          let lastOut = 0.0;
          for (let i = 0; i < bufferSize; i++) {
            const white = Math.random() * 2 - 1;
            data[i] = (lastOut + 0.02 * white) / 1.02;
            lastOut = data[i];
          }

          this.ambientSource = this.ctx.createBufferSource();
          this.ambientSource.buffer = buffer;
          this.ambientSource.loop = true;

          const filter = this.ctx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(450, this.ctx.currentTime);

          const lfo = this.ctx.createOscillator();
          lfo.frequency.setValueAtTime(0.18, this.ctx.currentTime);
          const lfoGain = this.ctx.createGain();
          lfoGain.gain.setValueAtTime(250, this.ctx.currentTime);
          lfo.connect(lfoGain);
          lfoGain.connect(filter.frequency);

          this.ambientGain = this.ctx.createGain();
          this.ambientGain.gain.setValueAtTime(0.01, this.ctx.currentTime);
          this.ambientGain.gain.linearRampToValueAtTime(0.06, this.ctx.currentTime + 2.0);

          this.ambientSource.connect(filter);
          filter.connect(this.ambientGain);
          this.ambientGain.connect(this.ctx.destination);

          this.ambientSource.start();
          lfo.start();
          this.ambientRunning = true;
          this.ambientLfo = lfo;
        } catch (e) {}
      }

      stopAmbientSea() {
        if (!this.ambientRunning) return;
        try {
          if (this.ambientGain && this.ctx) {
            this.ambientGain.gain.linearRampToValueAtTime(0.0001, this.ctx.currentTime + 0.8);
          }
          setTimeout(() => {
            if (this.ambientSource) try { this.ambientSource.stop(); } catch(e){}
            if (this.ambientLfo) try { this.ambientLfo.stop(); } catch(e){}
            this.ambientRunning = false;
          }, 900);
        } catch (e) {
          this.ambientRunning = false;
        }
      }
    }

    // ==========================================
    // 4. OCEAN SUNSET CANVAS BACKGROUND
    // ==========================================
    const OceanCanvas = () => {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animationFrameId;
        let width = (canvas.width = window.innerWidth);
        let height = (canvas.height = window.innerHeight);

        const handleResize = () => {
          width = canvas.width = window.innerWidth;
          height = canvas.height = window.innerHeight;
        };
        window.addEventListener('resize', handleResize);

        const clouds = [
          { x: width * 0.1, y: height * 0.12, r: 65, speed: 0.15, opacity: 0.35 },
          { x: width * 0.45, y: height * 0.22, r: 90, speed: 0.1, opacity: 0.25 },
          { x: width * 0.8, y: height * 0.08, r: 75, speed: 0.18, opacity: 0.3 },
          { x: width * 0.25, y: height * 0.3, r: 110, speed: 0.08, opacity: 0.2 }
        ];

        let t = 0;

        const render = () => {
          t += 0.015;
          ctx.clearRect(0, 0, width, height);

          // Sunset Sky
          const skyGrad = ctx.createLinearGradient(0, 0, 0, height);
          skyGrad.addColorStop(0, '#0A0F1D');
          skyGrad.addColorStop(0.3, '#1E2540');
          skyGrad.addColorStop(0.55, '#68291F');
          skyGrad.addColorStop(0.75, '#D95C27');
          skyGrad.addColorStop(0.9, '#F5A623');
          skyGrad.addColorStop(1, '#FFF3C4');
          ctx.fillStyle = skyGrad;
          ctx.fillRect(0, 0, width, height * 0.75);

          // Sun
          const sunX = width * 0.48;
          const sunY = height * 0.62;
          const sunRadius = Math.min(width, height) * 0.18;
          const sunGlow = ctx.createRadialGradient(sunX, sunY, sunRadius * 0.2, sunX, sunY, sunRadius * 2);
          sunGlow.addColorStop(0, 'rgba(255, 248, 220, 0.95)');
          sunGlow.addColorStop(0.35, 'rgba(255, 178, 62, 0.6)');
          sunGlow.addColorStop(0.7, 'rgba(235, 94, 40, 0.2)');
          sunGlow.addColorStop(1, 'rgba(235, 94, 40, 0)');
          ctx.fillStyle = sunGlow;
          ctx.beginPath();
          ctx.arc(sunX, sunY, sunRadius * 2, 0, Math.PI * 2);
          ctx.fill();

          // Soft Clouds
          clouds.forEach((cloud) => {
            cloud.x += cloud.speed;
            if (cloud.x - cloud.r * 2 > width) cloud.x = -cloud.r * 2;
            ctx.fillStyle = `rgba(255, 230, 210, ${cloud.opacity})`;
            ctx.beginPath();
            ctx.arc(cloud.x, cloud.y, cloud.r * 0.6, 0, Math.PI * 2);
            ctx.arc(cloud.x + cloud.r * 0.45, cloud.y - cloud.r * 0.2, cloud.r * 0.75, 0, Math.PI * 2);
            ctx.arc(cloud.x + cloud.r * 0.9, cloud.y, cloud.r * 0.55, 0, Math.PI * 2);
            ctx.fill();
          });

          // Sea Base
          const horizonY = height * 0.68;
          const seaGrad = ctx.createLinearGradient(0, horizonY, 0, height);
          seaGrad.addColorStop(0, '#243A5E');
          seaGrad.addColorStop(0.3, '#162843');
          seaGrad.addColorStop(0.7, '#0D1A2E');
          seaGrad.addColorStop(1, '#080D1A');
          ctx.fillStyle = seaGrad;
          ctx.fillRect(0, horizonY, width, height - horizonY);

          // Sun Water Reflection
          const reflectionGrad = ctx.createLinearGradient(sunX - 120, horizonY, sunX + 120, height);
          reflectionGrad.addColorStop(0, 'rgba(255, 235, 160, 0.45)');
          reflectionGrad.addColorStop(1, 'rgba(255, 140, 40, 0.05)');
          ctx.fillStyle = reflectionGrad;
          ctx.beginPath();
          ctx.moveTo(sunX - 50, horizonY);
          ctx.lineTo(sunX + 50, horizonY);
          ctx.lineTo(sunX + 180, height);
          ctx.lineTo(sunX - 180, height);
          ctx.closePath();
          ctx.fill();

          // Wave Layers
          const waveLayers = [
            { y: horizonY + 15, amp: 4, freq: 0.012, speed: 0.8, color: 'rgba(255, 240, 180, 0.25)' },
            { y: horizonY + 45, amp: 7, freq: 0.009, speed: 1.1, color: 'rgba(56, 120, 180, 0.4)' },
            { y: horizonY + 95, amp: 11, freq: 0.007, speed: 1.4, color: 'rgba(30, 70, 120, 0.55)' },
            { y: horizonY + 160, amp: 16, freq: 0.005, speed: 1.7, color: 'rgba(14, 35, 65, 0.75)' },
            { y: horizonY + 240, amp: 22, freq: 0.004, speed: 2.0, color: '#080D1A' }
          ];

          waveLayers.forEach((layer) => {
            ctx.fillStyle = layer.color;
            ctx.beginPath();
            ctx.moveTo(0, height);
            ctx.lineTo(0, layer.y);
            for (let x = 0; x <= width; x += 15) {
              const waveY =
                layer.y +
                Math.sin(x * layer.freq + t * layer.speed) * layer.amp +
                Math.cos(x * layer.freq * 0.5 + t * layer.speed * 0.6) * (layer.amp * 0.4);
              ctx.lineTo(x, waveY);
            }
            ctx.lineTo(width, height);
            ctx.closePath();
            ctx.fill();
          });

          animationFrameId = requestAnimationFrame(render);
        };

        render();
        return () => {
          window.removeEventListener('resize', handleResize);
          cancelAnimationFrame(animationFrameId);
        };
      }, []);

      return <canvas ref={canvasRef} className="absolute inset-0 w-full h-full pointer-events-none" />;
    };

        const card = cardRef.current;
        if (!card) return;
        const rect = card.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const centerX = rect.width / 2;
        const centerY = rect.height / 2;

        const rotateX = ((y - centerY) / centerY) * -7;
        const rotateY = ((x - centerX) / centerX) * 7;

        setTransformStyle(`perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.02, 1.02, 1.02)`);
        setGlowPos({ x: (x / rect.width) * 100, y: (y / rect.height) * 100 });
      };

      const handleMouseLeave = () => {
        setTransformStyle('perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)');
      };

          ref={cardRef}
          onMouseMove={handleMouseMove}

          currentProgress.current += diff * 0.14;
          wobbleRef.current += 0.08;

          setScrollProgress(currentProgress.current);
          setIsAtBottom(currentProgress.current >= 0.95);

          animationFrameRef.current = requestAnimationFrame(updatePhysics);
        };

        animationFrameRef.current = requestAnimationFrame(updatePhysics);

          window.removeEventListener('scroll', handleScroll);
          if (animationFrameRef.current) cancelAnimationFrame(animationFrameRef.current);
        };

                          />
                        </div>
                      </div>

                      <div>
                        <label className="block text-xs font-mono text-amber-300/80 uppercase mb-1">
                          Voyage Proposal / Message
                        </label>
                        <textarea
                          rows={4}
                          required
                          value={formState.message}
                          onChange={(e) => setFormState({ ...formState, message: e.target.value })}
                          placeholder="Tell me about your team, project idea, or open roles..."
                          className="w-full px-4 py-2.5 rounded-xl bg-slate-950/80 border border-slate-800 focus:border-amber-400 focus:outline-none text-sm text-white placeholder-slate-500 transition-colors resize-none"
                        />
                      </div>

                      <button
                        type="submit"
                        className="w-full py-3.5 px-6 rounded-2xl bg-gradient-to-r from-amber-500 via-orange-500 to-amber-600 hover:from-amber-400 hover:to-orange-500 text-slate-950 font-serif font-black text-sm tracking-wide shadow-lg hover:shadow-amber-500/40 transition-all active:scale-[0.99] flex items-center justify-center gap-2"
                      >
                        <span>Transmit Signal (Den Den Mushi)</span>
                        <span>🐚⚡</span>
                      </button>
                    </form>
                  )}
                </div>
              </div>
            </div>

          </div>
        </section>
      );
    };

    // ==========================================
    // 12. FOOTER
    // ==========================================
    const Footer = () => {
      const scrollToTop = () => {
        soundManager.playClick();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      return (
        <footer className="relative bg-[#060A14] border-t border-amber-500/20 py-12 text-slate-400 text-xs overflow-hidden">
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col md:flex-row items-center justify-between gap-6">
            <div className="flex items-center gap-3">
              <LogPoseIcon className="w-6 h-6 text-amber-400" />
              <div>
                <p className="font-serif font-black text-sm text-amber-200">
                  {developerInfo.name.toUpperCase()} • GRAND LINE FLEET
                </p>
                <p className="text-[11px] font-mono text-slate-500">
                  Forged with React, Tailwind, and Web Audio • One Piece Artistry
                </p>
              </div>
            </div>

            <div className="text-center md:text-left font-serif italic text-slate-400 text-xs max-w-sm">
              "Inherited Will, The Swell of the Age, and The Dreams of Its People — These are things that will never be stopped."
            </div>

            <div className="flex items-center gap-4">
              <a href={developerInfo.github} target="_blank" rel="noopener noreferrer" className="hover:text-amber-300 transition-colors">
                GitHub
              </a>
              <span>•</span>
              <a href={developerInfo.linkedin} target="_blank" rel="noopener noreferrer" className="hover:text-amber-300 transition-colors">
                LinkedIn
              </a>
              <span>•</span>
              <button
                onClick={scrollToTop}
                className="p-2 rounded-xl bg-slate-900 border border-slate-800 hover:border-amber-400/50 text-amber-300 font-mono text-[11px] transition-colors flex items-center gap-1"
              >
                <span>Top</span>
                <span>↑</span>
              </button>
            </div>
          </div>
        </footer>
      );
    };

    // ==========================================
    // 13. MASTER ROOT APP COMPONENT
    // ==========================================
    const App = () => {
      return (
        <div className="min-h-screen bg-[#080D1A] text-slate-100 font-sans selection:bg-amber-500 selection:text-slate-950 relative overflow-x-hidden">
          <Navbar />
          <main>
            <HeroCaptain />
            <GrandLineAbout />
            <ZoroDojo />
            <SanjiKitchen />
            <CrewContact />
          </main>
          <LuffyStretchingArm />
          <Footer />
        </div>
      );
    };

    // Mount to DOM
    const rootElement = document.getElementById('root');
    ReactDOM.createRoot(rootElement).render(<App />);
  </script>
</body>
</html>
